name: PR check
# PRs on booking-brilliance had NO checks (only deploy.yml, on push to main), so
# nothing verified a PR before merge. This runs lint + typecheck + tests + the
# full build (incl. prerender + blog word-count) on every PR, giving the CTO
# auto-merge a real signal instead of relying on the reviewer alone.
# Typecheck is enforced directly now that the ts-baseline is cleared: `pnpm
# build` is Vite, which strips types without checking them, so tsc is the only
# thing that catches a bad prop name or a dead branch.
on:
  pull_request:
    branches: [main]
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from packageManager in package.json (pnpm@10.33.4).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Google truncates a <title> past ~60 chars and a description past ~165,
      # which costs CTR at an unchanged ranking position. The blog is
      # regenerated daily, so without a gate the backlog rebuilds itself every
      # night. Kept out of `pnpm build` on purpose: build is what deploy.sh
      # runs, so a failure there would block the production deploy of the whole
      # site rather than just the offending change.
      - name: Meta lengths
        run: pnpm check:meta-lengths
      - name: Build
        run: pnpm build
