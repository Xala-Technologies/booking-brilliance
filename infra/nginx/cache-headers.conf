# Cache-Control + compression snippet for the digilist.no root server block.
#
# The sustain.no-cache finding: prerendered homepage/route HTML ships with
# no effective Cache-Control, so every repeat visit re-downloads the full
# document. `include` this file inside the `server { server_name
# digilist.no; ... }` block (see infra/apply-cache-headers.sh) to close it.
#
# `must-revalidate` (rather than a bare max-age) means a stale cached copy
# is never served past 5 minutes without checking back with the origin —
# a short max-age keeps a shipped fix or content update from being stuck
# behind a long-lived cache, while still cutting the bulk of repeat-visit
# re-downloads. Adjust max-age if a longer/shorter window is preferred, but
# keep must-revalidate.
#
# The sustain.html-weight finding (309KB raw HTML vs 100KB budget): the
# document already gzips to ~35-40KB (well under budget) — the gap is that
# compression isn't confirmed enabled on the live server. `gzip` ships with
# stock nginx and is safe to enable blanket for text responses.
location ~ \.html$ {
  add_header Cache-Control "public, max-age=300, must-revalidate" always;
}

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
# text/html is always gzipped by nginx regardless of gzip_types — listing it
# here just triggers a harmless "duplicate MIME type" warning on `nginx -t`.
gzip_types text/css application/javascript application/json application/xml
  image/svg+xml application/ld+json;

# Only add the brotli directives if the ngx_brotli module is actually
# compiled into this nginx build (`nginx -V 2>&1 | grep -o brotli`) —
# unlike gzip it isn't part of stock nginx, and an unknown directive fails
# `nginx -t` outright. infra/apply-cache-headers.sh checks this before
# uploading the brotli half of this file.
# brotli on;
# brotli_comp_level 5;
# brotli_types text/html text/css application/javascript application/json
#   application/xml image/svg+xml application/ld+json;
