# Per-app Content-Security-Policy for docs.digilist.no.
#
# infra/nginx/security-headers.conf deliberately ships every other security
# header but not this one ("a wrong CSP breaks a running app ... add a
# per-app CSP separately once its resource origins are known"). This is that
# policy. Every source below was enumerated from the *deployed* docs bundle
# — the live HTML, its built CSS and the Pagefind runtime — not from the
# source tree, because the source tree can be ahead of what is serving.
#
# `include` this only in the docs.digilist.no server block; every other
# Digilist vhost loads different resources and would break under it.
# infra/apply-security-headers.sh wires it up.
#
# Why each non-obvious source is here — do not prune one without re-checking
# the live site, several of these fail *silently*:
#
#   script-src 'unsafe-inline'
#     Starlight/Astro emit 5 inline <script> blocks per page (theme
#     bootstrap, sidebar state persistence, the DocsSearch widget, the
#     Norwegian label swap). nginx serves prebuilt static HTML, so there is
#     no request-time nonce to inject, and per-build hashes would have to be
#     regenerated on every content rebuild — a stale hash is a blank page.
#     This policy is therefore an origin allowlist, not XSS containment.
#
#   script-src 'wasm-unsafe-eval'
#     Pagefind — the docs' keyword search — compiles its index through
#     WebAssembly.instantiateStreaming. Any CSP that sets script-src without
#     this blocks wasm compilation, and search dies on every page with only
#     a console error. Confirmed in the live /pagefind/pagefind.js.
#
#   style-src 'unsafe-inline'
#     Starlight emits inline <style> plus ~300 style="" attributes a build.
#
#   font-src fonts.gstatic.com
#     The Fraunces / Public Sans / JetBrains Mono variable WOFF2s that
#     apps/docs/src/styles/digilist-overrides.css @font-face's directly (it
#     pulls the woff2 rather than the Google Fonts CSS, to keep the axes).
#
#   connect-src convex.digilist.no + convex.dev.digilist.no
#     DocsSearch's federated "ask" fetch. Both hosts are allowed so that
#     flipping PUBLIC_FEDERATED_SEARCH_URL between dev and prod does not
#     also need an nginx change — the live build currently points at dev.
#
#   frame-src howdygo.com
#     The interactive-demo iframe in
#     apps/docs/src/components/widgets/HowdygoDemo.astro. Every page today
#     renders its placeholder branch, but the iframe goes live the moment
#     any MDX passes `demoId`, and without this it would render as a blank
#     box. Allowing it now costs nothing and avoids a silent regression.
#
#   worker-src 'self'   — Pagefind's same-origin search worker.
#   img-src data:       — inline SVG data URIs in the built Starlight CSS.
#
# Nothing else is fetched cross-origin: the built HTML has no external
# <script>, <link rel="stylesheet">, <img>, srcset or preconnect. The other
# hosts that appear in the docs (stripe, vipps, difi, peppol, github) are
# prose links, which CSP does not govern.
#
# frame-ancestors 'none' restates the X-Frame-Options: DENY that
# security-headers.conf already sends; both are intentional, since
# frame-ancestors is the one modern browsers actually honour.
#
# To trial this before enforcing it, rename the directive below to
# Content-Security-Policy-Report-Only and re-run
# infra/apply-security-headers.sh — violations then show up in the browser
# console instead of blocking the resource.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://convex.digilist.no https://convex.dev.digilist.no; frame-src https://howdygo.com; worker-src 'self'; manifest-src 'self'" always;
