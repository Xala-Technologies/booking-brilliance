# Shared security-header snippet for Digilist nginx server blocks.
#
# The main digilist.no block already sets these. The audit originally flagged
# status.digilist.no, dev.digilist.no, dashboard.dev.digilist.no and
# docs.digilist.no for missing HSTS / X-Frame-Options / X-Content-Type-Options
# / Referrer-Policy / Permissions-Policy — but status/dev/dashboard.dev turned
# out to already have a complete, hand-maintained header block predating that
# audit (see infra/apply-security-headers.sh's TARGETS comment). Only
# docs.digilist.no actually needed this include; `include` it inside a
# `server {}` block only for hosts that don't already set these headers
# themselves, or every header below gets sent twice.
#
# NOTE: Content-Security-Policy is deliberately NOT included here — a wrong
# CSP breaks a running app, and these surfaces load different resources than
# the marketing site. Add a per-app CSP separately once its resource origins
# are known. Everything below is safe to apply blanket.
#
# HSTS carries `preload` to match every other manually-hardened Digilist
# vhost (app.digilist.no, agent.digilist.no, digilist-apps.conf all use it).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), interest-cohort=()" always;
