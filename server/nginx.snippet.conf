# Add this inside the `server { server_name digilist.no; ... }` block
# in /etc/nginx/sites-enabled/digilist-apps.conf, then `nginx -s reload`.

# ── XAL-1373: Redirect untranslated /en/* paths to Norwegian equivalents ──────
# Any /en/* path without an English translation gets a 301 to the Norwegian URL.
# Prevents crawlers from indexing Norwegian content under English URLs.
# Must come BEFORE the `try_files` fallback so the 301 happens before SPA shell.
location ~ ^/en/leie/(kontorlokaler|selskapslokale|gaard|bursdagslokale|kulturhus|moterom|konferanselokale|coworking|idrettshall|hall|padelbane|svommehall|hobbyklubb|konfirmasjonslokale|firmafest|minnestund|daap|jubileum)/?$ {
    return 301 https://digilist.no/leie/$1;
}
location ~ ^/en/overnatting/(hytte|leilighet|rom|feriehus)/?$ {
    return 301 https://digilist.no/overnatting/$1;
}
location ~ ^/en/utstyr/(festutstyr|verktoy-maskiner|lyd-og-lys|sport-og-friluft)/?$ {
    return 301 https://digilist.no/utstyr/$1;
}
location ~ ^/en/tjenester/(catering|dj|musiker|dekor)/?$ {
    return 301 https://digilist.no/tjenester/$1;
}
location ~ ^/en/arrangementer/(konsert|teater-og-scene|festival|sport)/?$ {
    return 301 https://digilist.no/arrangementer/$1;
}
location ~ ^/en/(overnatting|utstyr|tjenester|arrangementer|om-oss|teknologi|ai-agenter)/?$ {
    return 301 https://digilist.no/$1;
}
location ~ ^/en/bruksomrader/(selskapslokaler|moterom|idrettshaller-gymsaler|kulturhus-kantiner)/?$ {
    return 301 https://digilist.no/bruksomrader/$1;
}
location ~ ^/en/ai-agenter/(sesongtildeling|compliance-godkjenning|importer-oppforing)/?$ {
    return 301 https://digilist.no/ai-agenter/$1;
}
location ~ ^/en/lokaler-til-leie/(oslo|bergen|trondheim|stavanger|kristiansand|tromso|drammen|baerum|fredrikstad|sandnes|alesund|bodo|sandefjord|tonsberg|sarpsborg|haugesund)/?$ {
    return 301 https://digilist.no/lokaler-til-leie/$1;
}
location = /en/rapport/utleiemarkedet-norge-2026 {
    return 301 https://digilist.no/rapport/utleiemarkedet-norge-2026;
}

# ── Everything else under /en: the prerendered file, or a 404 ────────────────
# Never the SPA shell. Any /en path with no file on disk used to fall through
# to `try_files`' last argument and answer 200 with the Norwegian shell —
# lang="nb-NO", `index, follow`, canonical to the homepage. A soft 404 Google
# is free to index, on an unbounded URL space. `Disallow: /en/` in robots.txt
# was the only thing covering that, and it has been removed because it was
# also blocking the 26 real English pages and freezing ~400 noindex'd mirror
# URLs into the index with no snippet (see the comment block in
# public/robots.txt). `=404` is the replacement, and a smaller hammer.
#
# Deliberately a REGEX location, not `location ^~ /en/`. A `^~` prefix match
# takes precedence over regex locations, so it would swallow every 301 above
# and this snippet would silently stop redirecting. Regex locations are tried
# in order of appearance, so this one must stay LAST of the /en blocks.
location ~ ^/en(/|$) {
    try_files $uri $uri/index.html =404;
}

# `^~` stops nginx from falling through to a regex location (like the ones
# below) for anything under /api/, so a proxied path that happens to end in
# .svg/.png/etc. still hits the proxy instead of being served from disk.
location ^~ /api/ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
}

# XAL-1156: no static asset on this domain sends a Cache-Control header today
# and responses aren't compressed — Lighthouse's "uses-long-cache-ttl" and
# "uses-text-compression" audits flag both. gzip covers text-ish responses
# (JS/CSS/HTML/SVG/JSON); video/image formats are already compressed, so
# gzip-ing them wastes CPU for zero size win — deliberately left out of
# gzip_types. Brotli would compress further but needs the ngx_brotli module,
# which isn't confirmed installed on this host; left as an optional follow-up
# rather than guessed at here.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    application/manifest+json
    image/svg+xml;

# Vite content-hashes every filename under /assets/ (changes whenever the
# content does), so it's safe to cache for a year with `immutable` — a
# redeploy ships new filenames, it never mutates an old one.
#
# nginx only inherits the server block's `add_header` directives when a
# location adds none of its own — since the locations below add
# Cache-Control, they'd otherwise silently drop every security header the
# digilist.no server block sets (DEPLOYMENT.md documents HSTS,
# X-Content-Type-Options, X-Frame-Options, X-XSS-Protection, Referrer-Policy,
# a CSP and a Permissions-Policy on this domain). Re-declare the headers with
# a stable, fully-specified value here. CSP and Permissions-Policy are NOT
# reproduced below, and that's fine to ship as-is: both are document-scoped
# (they govern what the HTML page is allowed to load/embed), not enforced
# per sub-resource, so omitting them on JS/CSS/font/image responses has no
# security effect.
location ~* ^/assets/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No `always` here: with it, nginx would set this on 404/5xx too, so a
    # transient miss on a deploy-race or a stale-hash request would cache the
    # error itself as immutable for a year. Without `always`, it's only set
    # on 2xx/3xx.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Fonts under /fonts/ keep fixed filenames (unlike Vite's hashed /assets/
# names), so they must NOT get `immutable`: a re-subset shipped under the
# same filename would leave already-cached visitors on the stale file for up
# to a year with no way to revalidate. A day of caching with revalidation
# still closes the "no cache header at all" gap without that trap.
location ~* ^/fonts/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
}

# Every other static file (favicons, og-image, logo, hero/client images, the
# homepage demo videos) is NOT content-hashed, so — same reasoning as
# /fonts/ — a shorter cache with revalidation is safer than immutable: a
# same-name file can legitimately change between deploys.
location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|webmanifest|mp4|webm)$ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No `always` here — see the /assets/ location above.
    add_header Cache-Control "public, max-age=86400, must-revalidate";
}
